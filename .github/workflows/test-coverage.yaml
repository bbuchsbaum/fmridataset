# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            any::bidser
            github::bbuchsbaum/fmristore@e7fbbfca181ebd118acee150774a4f58640e039d
          needs: coverage

      - name: Test coverage
        run: |
          # covr 3.6.5 cannot form line ranges when source-marker exclusions
          # meet records without srcref data. Coverage must not silently drop
          # those regions, so this job disables marker exclusions entirely.
          options(
            covr.exclude_pattern = "a^",
            covr.exclude_start = "a^",
            covr.exclude_end = "a^"
          )
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          percent <- covr::percent_coverage(cov)
          pct <- round(percent, 2)
          files <- covr::coverage_to_list(cov)$filecoverage
          lines <- capture.output({
            cat(sprintf("Coverage: %.2f%%\n", percent))
            print(files)
          })
          writeLines(lines, "coverage-summary.txt")
          writeLines(as.character(pct), "coverage-percent.txt")
          writeLines(format(percent, digits = 15, scientific = FALSE), "coverage-percent-raw.txt")
          cat(paste(lines, collapse = "\n"), "\n")
          cat(sprintf("Overall coverage: %s%%\n", pct))
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Report coverage percent
        run: |
          echo "Overall package coverage: $(cat coverage-percent.txt)%"

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-evidence
          path: |
            cobertura.xml
            coverage-summary.txt
            coverage-percent.txt
            coverage-percent-raw.txt
          if-no-files-found: warn

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          use_oidc: true

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
