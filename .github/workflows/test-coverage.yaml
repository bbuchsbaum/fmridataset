# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            any::bidser
            github::bbuchsbaum/fmristore@e7fbbfca181ebd118acee150774a4f58640e039d
          needs: coverage

      - name: Test coverage
        run: |
          # covr 3.6.5 cannot form line ranges when source-marker exclusions
          # meet records without srcref data. Coverage must not silently drop
          # those regions, so this job disables marker exclusions entirely.
          options(
            covr.exclude_pattern = "a^",
            covr.exclude_start = "a^",
            covr.exclude_end = "a^"
          )
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          percent <- covr::percent_coverage(cov)
          files <- covr::coverage_to_list(cov)$filecoverage
          lines <- capture.output({
            cat(sprintf("Coverage: %.2f%%\n", percent))
            print(files)
          })
          writeLines(lines, "coverage-summary.txt")
          cat(paste(lines, collapse = "\n"), "\n")
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: |
            cobertura.xml
            coverage-summary.txt
          if-no-files-found: warn

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          file: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
