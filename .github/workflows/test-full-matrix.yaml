# GitHub Actions workflow for testing with all optional packages
# This ensures that tests don't silently pass due to missing dependencies
name: test-full-matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}-full
  cancel-in-progress: true

jobs:
  test-all-optional:
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
    
    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) - all optional packages
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'devel'}
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Ensure tests are not skipped
      NOT_CRAN: true
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_FORCE_SUGGESTS_: true
      RGL_USE_NULL: true
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-pandoc@v2
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      
      # Install system dependencies for optional packages
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libudunits2-dev libgdal-dev libgeos-dev libproj-dev
      
      # Install all dependencies including suggests
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
          needs: check
          dependencies: '"all"'
      
      # No Bioconductor step: fmridataset builds lazy array support on delarr,
      # which this project owns, rather than on DelayedArray.
      
      # Verify all optional packages are installed
      - name: Check optional packages
        run: |
          dir.create("ci-evidence", showWarnings = FALSE)
          description <- read.dcf("DESCRIPTION")
          optional_pkgs <- trimws(strsplit(
            gsub("\\s*\\([^)]*\\)", "", description[1, "Suggests"]), ","
          )[[1L]])
          optional_pkgs <- optional_pkgs[nzchar(optional_pkgs)]
          errors <- setNames(rep("", length(optional_pkgs)), optional_pkgs)
          available <- vapply(optional_pkgs, function(pkg) {
            tryCatch({
              loadNamespace(pkg)
              TRUE
            }, error = function(e) {
              errors[[pkg]] <<- conditionMessage(e)
              FALSE
            })
          }, logical(1))
          field <- function(pkg, name) {
            if (!available[[pkg]]) return(NA_character_)
            value <- utils::packageDescription(pkg, fields = name)
            if (is.null(value) || is.na(value) || !nzchar(value)) NA_character_ else value
          }
          receipt <- data.frame(
            package = optional_pkgs,
            available = unname(available),
            version = vapply(optional_pkgs, function(pkg) {
              if (available[[pkg]]) as.character(utils::packageVersion(pkg)) else NA_character_
            }, character(1)),
            remote_sha = vapply(optional_pkgs, field, character(1), name = "RemoteSha"),
            repository = vapply(optional_pkgs, field, character(1), name = "Repository"),
            error = unname(errors)
          )
          utils::write.csv(receipt, "ci-evidence/optional-package-receipt.csv",
            row.names = FALSE
          )
          print(receipt, row.names = FALSE)
          if (any(!available)) {
            stop("Missing or unloadable optional packages: ",
              paste(optional_pkgs[!available], collapse = ", "))
          }
          cat("All DESCRIPTION Suggests are installed and loadable.\n")
        shell: Rscript {0}
      
      # Run the source-loaded test suite with every Suggest installed.
      - name: Test with all optional packages
        run: |
          # test_local() installs/loads this checkout's source package before
          # discovering tests; it cannot silently test an empty namespace.
          res <- testthat::test_local(
            ".",
            reporter = "summary",
            stop_on_failure = FALSE
          )

          df <- as.data.frame(res)
          dir.create("ci-evidence", showWarnings = FALSE)
          utils::write.csv(df, "ci-evidence/test-results.csv", row.names = FALSE)
          bad <- sum(df$failed, na.rm = TRUE) + sum(df$error, na.rm = TRUE)
          if (bad > 0) stop("Test failures or errors: ", bad)

          # Skip reasons live on the expectation conditions, not on an attribute.
          skips <- unlist(lapply(res, function(f) {
            r <- f$results
            if (is.null(r)) return(character(0))
            vapply(Filter(function(e) inherits(e, "expectation_skip"), r),
                   conditionMessage, character(1))
          }), use.names = FALSE)
          skips <- sub("^Reason: ", "", sub("\n.*", "", skips))

          if (length(skips)) {
            cat("Skipped", length(skips), "tests:\n")
            for (s in sort(unique(skips))) {
              cat(sprintf("  %3d  %s\n", sum(skips == s), s))
            }
          }

          # This job installs every optional package, so a skip that names an absent
          # or inadequate dependency means the matrix is not testing what it claims.
          dep_gap <- grep(
            "not installed|not available|lacks|is required|is not TRUE",
            skips, value = TRUE
          )
          if (length(dep_gap)) {
            stop("Optional-dependency gaps in the all-optional-packages matrix:\n",
                 paste(unique(dep_gap), collapse = "\n"))
          }
        shell: Rscript {0}
      
      # Run R CMD check
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          check-dir: '"check"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
      
      # Upload test results
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: |
            check
            ci-evidence
          if-no-files-found: warn

  test-minimal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    name: ubuntu-latest (release) - minimal dependencies only
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-pandoc@v2
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      
      # Install only required dependencies. knitr is not an optional feature
      # here: DESCRIPTION declares VignetteBuilder: knitr, so R CMD build fails
      # in loadVignetteBuilder() without it, even with --no-build-vignettes.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Do not restore a broader all-optional cache into this proof job.
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::knitr
            any::testthat
          dependencies: '"hard"'
      
      # Verify the installed library against a retained hard-only lockfile.
      - name: Check minimal setup
        run: |
          dir.create("ci-evidence", showWarnings = FALSE)
          pak::lockfile_create(
            c("deps::.", "any::sessioninfo", "any::rcmdcheck",
              "any::knitr", "any::testthat"),
            lockfile = "ci-evidence/minimal-hard-dependencies.lock",
            dependencies = "hard"
          )
          lock <- jsonlite::read_json(
            "ci-evidence/minimal-hard-dependencies.lock", simplifyVector = TRUE
          )
          hard_graph <- lock$packages$package
          description <- read.dcf("DESCRIPTION")
          optional_pkgs <- trimws(strsplit(
            gsub("[(][^)]*[)]", "", description[1, "Suggests"]), ","
          )[[1L]])
          installed <- optional_pkgs[vapply(optional_pkgs, requireNamespace,
            logical(1), quietly = TRUE
          )]
          leaked <- setdiff(installed, hard_graph)
          if (length(leaked) > 0) {
            stop("Packages outside the retained hard-only graph leaked into ",
              "the minimal test: ", paste(leaked, collapse = ", "))
          }
          cat("Minimal setup matches the retained hard-only dependency graph.\n")
        shell: Rscript {0}
      
      # Run R CMD check with minimal deps
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          check-dir: '"check"'
          args: 'c("--no-manual", "--no-vignettes", "--no-build-vignettes")'

      - name: Upload minimal check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-dependencies-results
          path: |
            check
            ci-evidence
          if-no-files-found: warn
