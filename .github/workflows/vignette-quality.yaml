name: vignette-quality

on:
  push:
    branches: [main, master]
    paths:
      - 'vignettes/**'
      - 'inst/WORDLIST'
      - '.github/workflows/vignette-quality.yaml'
  pull_request:
    paths:
      - 'vignettes/**'
      - 'inst/WORDLIST'
      - '.github/workflows/vignette-quality.yaml'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    name: Vignette spelling, code, and links

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::spelling
            any::lintr
            any::pkgdown
            any::hunspell
          needs: website

      - name: Spell check committed vignette sources
        run: |
          files <- list.files("vignettes", pattern = "[.]Rmd$", full.names = TRUE)
          dictionary <- readLines("inst/WORDLIST", warn = FALSE)
          results <- spelling::spell_check_files(files, ignore = dictionary)
          print(results)
          if (nrow(results)) stop("Spelling errors found in vignette sources.")
        shell: Rscript {0}

      - name: Correctness-lint vignette R code
        run: |
          files <- list.files("vignettes", pattern = "[.]Rmd$", full.names = TRUE)
          linters <- lintr::linters_with_tags("correctness")
          # API sketches use `...` as deliberate pseudo-code, which the object
          # usage linter cannot distinguish from executable R.
          linters$object_usage_linter <- NULL
          findings <- unlist(lapply(files, function(path) {
            lintr::lint(path, linters = linters)
          }), recursive = FALSE)
          for (finding in findings) print(finding)
          cat(sprintf("Vignette correctness lint findings: %d\n", length(findings)))
          if (length(findings)) stop("Vignette correctness lint failed.")
        shell: Rscript {0}

      - name: Build site and check links
        run: |
          pkgdown::build_site(preview = FALSE, lazy = FALSE)
          pkgdown::check_pkgdown()
        shell: Rscript {0}

      - name: Upload rendered-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vignette-quality-site
          path: docs
          if-no-files-found: warn
